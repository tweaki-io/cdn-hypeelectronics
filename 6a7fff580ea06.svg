<svg viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B3D"/>
      <stop offset="100%" stop-color="#5B2A6B"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="500" fill="url(#bgGradient)"/>

  <!-- Soft glow blobs -->
  <circle cx="1400" cy="80" r="220" fill="#F472B6" opacity="0.18"/>
  <circle cx="1500" cy="420" r="180" fill="#C026D3" opacity="0.15"/>
  <circle cx="60" cy="450" r="150" fill="#F472B6" opacity="0.12"/>

  <!-- Hair styler / straightener icon (right side) -->
  <g transform="translate(1220,110)">
    <!-- barrel -->
    <rect x="0" y="0" width="60" height="260" rx="30" fill="none" stroke="#F9A8D4" stroke-width="6"/>
    <!-- handle -->
    <rect x="10" y="250" width="40" height="130" rx="16" fill="none" stroke="#F9A8D4" stroke-width="6"/>
    <!-- steam/style lines -->
    <path d="M-40 40 Q-70 60 -40 90" stroke="#F472B6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M-20 20 Q-55 45 -20 75" stroke="#F472B6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M100 40 Q130 60 100 90" stroke="#F472B6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M80 20 Q115 45 80 75" stroke="#F472B6" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Small sparkle accent -->
  <path d="M175 100 L188 140 L228 153 L188 166 L175 206 L162 166 L122 153 L162 140 Z"
        fill="url(#accentGradient)"/>

  <!-- Eyebrow -->
  <text x="230" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="600"
        font-size="24" fill="#F9A8D4" letter-spacing="6">CATEGORY</text>

  <!-- Title -->
  <text x="228" y="245" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="80" fill="#FFFFFF">Hair Stylers</text>

  <!-- Subtitle -->
  <text x="230" y="290" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="26" fill="#EBD4F0">Salon-quality style, right at home.</text>

  <!-- Tagline -->
  <text x="230" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="400"
        font-size="20" fill="#F9A8D4" font-style="italic">Straighteners · Curlers · Dryers · Multi-stylers</text>

  <!-- CTA button -->
  <rect x="230" y="370" width="270" height="64" rx="32" fill="url(#btnGradient)"/>
  <text x="365" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="24" fill="#FFFFFF">Shop Hair Stylers</text>
</svg>
