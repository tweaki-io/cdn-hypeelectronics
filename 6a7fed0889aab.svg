<svg viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boltGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1400" height="780" fill="#FFFFFF"/>

  <!-- Circuit lines (subtle, behind bolt) -->
  <g stroke="url(#boltGradient)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M580 300 H500 V260"/>
    <circle cx="500" cy="260" r="8" fill="#0EA5E9"/>
    <path d="M600 340 H540"/>
    <circle cx="540" cy="340" r="8" fill="#0EA5E9"/>
    <path d="M760 235 H820 V270"/>
    <circle cx="820" cy="270" r="8" fill="#2563EB"/>
    <path d="M780 320 H860 V300"/>
    <circle cx="860" cy="300" r="8" fill="#2563EB"/>
    <path d="M650 390 V430"/>
    <circle cx="650" cy="430" r="8" fill="#0EA5E9"/>
    <path d="M760 200 V160"/>
    <circle cx="760" cy="160" r="8" fill="#2563EB"/>
  </g>

  <!-- Lightning bolt with circuit-style geometric cut -->
  <path d="M755 150
           L640 400
           L705 400
           L650 620
           L800 350
           L735 350
           L790 150
           Z"
        fill="url(#boltGradient)"/>

  <!-- Brand name -->
  <text x="700" y="560" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="96" fill="url(#textGradient)" letter-spacing="2">
    Hype<tspan fill="#2563EB">electronics</tspan>
  </text>

  <!-- Tagline -->
  <text x="700" y="610" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="500"
        font-size="30" fill="#64748B" letter-spacing="6">
    GADGETS · ACCESSORIES · STYLE
  </text>
</svg>
